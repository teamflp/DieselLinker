[package]
name = "diesel_linker"
version = "1.3.0"
edition = "2021"
description = "A procedural macro to link Diesel models"
authors = ["Paterne G. G. paterne81@hotmail.fr"]
repository = "https://github.com/teamflp/DieselLinker"
license = "MIT OR Apache-2.0"
keywords = ["diesel", "proc-macro", "linker", "relation", "database"]
categories = ["database"]
readme = "README.md"

[lib]
proc-macro = true

[features]
default = []
# Backend features are only needed to compile optional integration tests.
# Consumers of the proc-macro do not need them.
mysql = ["diesel/mysql", "diesel-async/mysql"]
postgres = ["diesel/postgres", "diesel/postgres_backend", "diesel-async/postgres"]

[dependencies]
syn = { version = "1.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
Inflector = "0.11.4"

[dev-dependencies]
diesel = { version = "2.2.2", default-features = false, features = ["sqlite"] }
diesel-async = { version = "0.9.0", default-features = false, features = ["tokio", "sync-connection-wrapper"] }
libsqlite3-sys = { version = "0.28.0", features = ["bundled"] }
trybuild = "1.0"
tokio = { version = "1", features = ["full"] }
